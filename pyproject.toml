[project]
name = "adbrain"
version = "0.1.0"
description = "Growth marketing automation for Opterra Ventures — ad copy generation, experiment memory, and category monitoring."
requires-python = ">=3.11"

# Deliberately zero runtime dependencies. Everything uses the Python standard
# library (csv, json, tomllib, dataclasses, argparse). This means `adbrain`
# runs on a clean machine with no install step and nothing to break on upgrade.
# See DECISIONS.md #2 for the tradeoff.
dependencies = []

[project.scripts]
adbrain = "adbrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
