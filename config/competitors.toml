# Category watchlist for Phase 4 monitoring.
#
# `direct` are the vendors a prospect is already evaluating.
# `adjacent` are where new angles actually come from — they sell to the same
# buyer about a different problem, and they will invent the framing that shows
# up in this category six months later. Include them; a watchlist of only direct
# competitors will tell you what you already know.
#
# `page_id` is the Meta Page ID, needed for exact Ad Library lookups. Leave it
# empty and the fetcher falls back to a name search, which is noisier.
# `adbrain competitors --resolve` will look up IDs for the names listed here.

[meta]
country = "US"
ad_active_status = "ALL"     # ALL captures ads that have stopped — that is the signal
languages = ["en"]

