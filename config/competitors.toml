# Category watchlist for Phase 4 monitoring.
#
# `direct` are the vendors an Opterra prospect is already evaluating.
# `adjacent` are where new angles actually come from — they sell to the same
# owner about a different problem, and they will invent the framing that later
# shows up in our category.
#
# `page_id` is the Meta Page ID, needed for exact Ad Library lookups. Leave it
# empty and the fetcher falls back to a name search, which is noisier.

[meta]
country = "US"
ad_active_status = "ALL"     # ALL captures ads that have stopped — that is the signal
languages = ["en"]

[[direct]]
name = "Mindbody"
page_id = ""
note = "the incumbent; expensive and bloated is the standing complaint"

[[direct]]
name = "Vagaro"
page_id = ""
note = "clunky UI, poor support"

[[direct]]
name = "Zenoti"
page_id = ""
note = "enterprise complexity in a small-practice world"

[[direct]]
name = "Mangomint"
page_id = ""
note = "closest on design; watch them for AI/automation messaging"

[[direct]]
name = "Jane App"
page_id = ""
note = "Canada-centric; watch for US expansion messaging"

[[adjacent]]
