# Platform character limits — the single source of truth for validation.
#
# These are enforced PROGRAMMATICALLY (src/adbrain/platforms.py), not just asked
# for in a prompt. Anything over limit is rejected and regenerated, never
# truncated. Edit numbers here and every check downstream picks them up.
#
# "limit"  = hard gate. Copy over this is rejected.
# "hard_max" = the platform's true API maximum, recorded for reference. We
#            deliberately gate on the *recommended* display limit instead,
#            because copy that is accepted by the API but truncated in the feed
#            is a silent failure. See DECISIONS.md #4.

[google_rsa]
label = "Google Ads — Responsive Search Ad"
bulk_format = "google_rsa_editor"

  [google_rsa.fields.headline]
  limit = 30
  min_count = 3
  max_count = 15

  [google_rsa.fields.description]
  limit = 90
  min_count = 2
  max_count = 4

  [google_rsa.fields.path1]
  limit = 15
  min_count = 0
  max_count = 1

  [google_rsa.fields.path2]
  limit = 15
  min_count = 0
  max_count = 1

