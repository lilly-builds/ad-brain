# Voice rules, in machine-enforceable form.
#
# This is the gate. `brand/voice.md` is the human explanation; this file is what
# actually rejects a line. If a rule is not here, the validator will not catch
# it, no matter how clearly it is written in the markdown.
#
# Shipped as a neutral starter set. Edit it for the brand — every section can be
# emptied, loosened, or extended without touching code.
#
# severity = "error"  -> line is rejected and sent back for regeneration
# severity = "warn"   -> line passes but is listed in the report for review

# ---------------------------------------------------------------------------
# Letter case.
#   rule = "any"        -> no case rule (default; most brands)
#   rule = "lowercase"  -> reject any capital outside the allow-list
#   rule = "sentence"   -> reject ALL-CAPS words outside the allow-list
# ---------------------------------------------------------------------------
[case]
rule = "any"
severity = "error"
plain_english = "no case rule set — set rule = \"lowercase\" or \"sentence\" if the brand has one"
# Proper nouns exempt from the case rule. Add brand and customer names here.
allow_capitalized = []

# ---------------------------------------------------------------------------
# Emoji. Most paid-search copy bans them outright; social brands often do not.
# Set severity = "warn" to allow them with a flag, or delete this section.
# ---------------------------------------------------------------------------
[emoji]
severity = "error"
plain_english = "no emoji in ad copy"

# ---------------------------------------------------------------------------
# Banned words and phrases.
#
# The entries below are generic ad-copy filler that reads as noise in almost any
# category — they are a starting point, not a position on the brand. Delete any
# that do not apply and add the brand's own. `pattern` is a regular expression,
# matched case-insensitively.
# ---------------------------------------------------------------------------
[banned_terms]
severity = "error"
plain_english = "words and phrases this brand does not use"

  [[banned_terms.entries]]
  pattern = "cutting.edge|state.of.the.art|revolutionary|game.chang|best.in.class|world.class|next.generation"
  reason = "superlative filler — says nothing a buyer can picture"

  [[banned_terms.entries]]
  pattern = "\\bleverage\\b|\\bsynergy\\b|\\brobust\\b|\\bseamless(ly)?\\b|\\bempower\\b|\\bsupercharge\\b|\\bturbocharge\\b"
  reason = "vendor register — reads as marketing, not as a person talking"

  [[banned_terms.entries]]
  pattern = "don't miss out|dont miss out|before it's too late|last chance|act now|limited time only"
  reason = "manufactured urgency — only allowed when the scarcity is genuine and named"

# ---------------------------------------------------------------------------
# Style preferences. Flagged for a human, never auto-rejected.
# `applies_to` limits a check to specific fields; omit it to check everywhere.
# ---------------------------------------------------------------------------
[soft_checks]
severity = "warn"
plain_english = "style preferences worth a human look, not automatic rejection"

  [[soft_checks.entries]]
  name = "second_person"
  applies_to = ["primary_text", "intro_text"]
  requires_any = ["you", "your"]
  reason = "body copy usually reads better addressed directly to the reader"

# ---------------------------------------------------------------------------
# Numeric claims. Any number in generated copy that does not appear in
# brand/proof.md or in `always_allowed` gets flagged for verification.
#
# This is the check that stops the system inventing a statistic. Keep it on.
# `always_allowed` is for descriptive numbers that are not performance claims.
# ---------------------------------------------------------------------------
[claims]
severity = "warn"
plain_english = "numbers in ad copy must trace to an approved proof point"
always_allowed = ["24/7", "24", "7", "365", "1", "2", "3", "5", "10"]
